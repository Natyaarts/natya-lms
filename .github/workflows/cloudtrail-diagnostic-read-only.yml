name: CloudTrail Read-Only Diagnostic (Staging)

on:
  workflow_dispatch:
    inputs:
      confirm_diagnostic:
        description: 'Type INSPECT-CLOUDTRAIL to confirm read-only CloudTrail inspection'
        required: true
        default: 'INSPECT-CLOUDTRAIL'

permissions:
  id-token: write
  contents: read

jobs:
  inspect-cloudtrail:
    name: Inspect CloudTrail Event Selectors & S3 Logging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Safety Guard - Verify Confirmation
        env:
          CONFIRM: ${{ inputs.confirm_diagnostic }}
        run: |
          if [ "$CONFIRM" != "INSPECT-CLOUDTRAIL" ]; then
            echo "::error::Diagnostic inspection rejected. You must type INSPECT-CLOUDTRAIL."
            exit 1
          fi

      - name: Safety Guard - Enforce Exact Staging Branch
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" != "staging/video-protection" ]; then
            echo "::error::Diagnostic workflow can only run on exact branch 'staging/video-protection' (invoked on '$REF'). Failing closed."
            exit 1
          fi

      - name: Safety Guard - Validate Staging Secrets & Target Isolation
        env:
          ROLE_ARN: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          STAGING_STORAGE_BUCKET: ${{ secrets.STAGING_AWS_STORAGE_BUCKET_NAME || '' }}
        run: |
          set -eu
          [ -n "$ROLE_ARN" ] || { echo "::error::Missing STAGING_AWS_ROLE_ARN"; exit 1; }
          [ -n "$EXPECTED_ACCOUNT" ] || { echo "::error::Missing STAGING_AWS_ACCOUNT_ID"; exit 1; }

          # Enforce staging account boundary (strictly fixed to 703671910601)
          if [ "$EXPECTED_ACCOUNT" != "703671910601" ]; then
            echo "::error::Staging account ID must be 703671910601."
            exit 1
          fi

          # Prohibit production environment and bucket targets
          if [ "$EB_ENV" = "Natya-lms-backend-env" ]; then
            echo "::error::Production environment target is strictly prohibited."
            exit 1
          fi

          if [ "$STAGING_STORAGE_BUCKET" = "natyalms-media-2026" ]; then
            echo "::error::Production media bucket target is strictly prohibited."
            exit 1
          fi

      - name: Authenticate to AWS via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          role-session-name: GitHubActions-NatyaLMS-CloudTrailDiag
          aws-region: ap-south-1

      - name: Verify Authenticated AWS Account & Region (Fail Closed)
        env:
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
          EXPECTED_REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          CALLER_IDENTITY=$(aws sts get-caller-identity --output json)
          CALLER_ACCOUNT=$(echo "$CALLER_IDENTITY" | jq -r '.Account')
          CALLER_ARN=$(echo "$CALLER_IDENTITY" | jq -r '.Arn')

          echo "Authenticated Principal: $CALLER_ARN"
          echo "Authenticated AWS Account: $CALLER_ACCOUNT"

          # Fail closed if caller account does not match expected staging account
          if [ -z "$CALLER_ACCOUNT" ] || [ "$CALLER_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Authenticated account ($CALLER_ACCOUNT) does not match expected staging account ($EXPECTED_ACCOUNT). Failing closed."
            exit 1
          fi

          if [ "$EXPECTED_ACCOUNT" != "703671910601" ] || [ "$CALLER_ACCOUNT" != "703671910601" ]; then
            echo "::error::Target account is strictly fixed to staging account 703671910601. Failing closed."
            exit 1
          fi

          echo "AWS Account verification passed: $CALLER_ACCOUNT matches expected staging account (703671910601)."
          echo "CALLER_ARN=$CALLER_ARN" >> "$GITHUB_ENV"
          echo "CALLER_ACCOUNT=$CALLER_ACCOUNT" >> "$GITHUB_ENV"

          # Strict fail-closed target region enforcement (mandatory ap-south-1)
          # Note: Verifying environment configuration ensures the client runtime is explicitly targeting ap-south-1.
          # It does not imply that local configuration independently proves the wire-level destination of individual requests.
          TARGET_REGION="ap-south-1"
          CONF_REGION="${EXPECTED_REGION:-ap-south-1}"

          if [ "$CONF_REGION" != "$TARGET_REGION" ]; then
            echo "::error::Configured staging region ($CONF_REGION) must be $TARGET_REGION. Failing closed."
            exit 1
          fi

          CURRENT_AWS_REGION="${AWS_REGION:-${AWS_DEFAULT_REGION:-}}"

          if [ -z "$CURRENT_AWS_REGION" ]; then
            echo "::error::AWS region environment variable (AWS_REGION or AWS_DEFAULT_REGION) is unset. Cannot verify client target region. Failing closed."
            exit 1
          fi

          if [ "$CURRENT_AWS_REGION" != "$TARGET_REGION" ]; then
            echo "::error::Active AWS region environment ($CURRENT_AWS_REGION) does not match mandatory target region '$TARGET_REGION'. Failing closed."
            exit 1
          fi

          echo "AWS Region verification passed: Environment is explicitly configured for target region '$TARGET_REGION'."

      - name: Inspect CloudTrail Trails and Event Selectors (Read-Only)
        env:
          REGION: "ap-south-1"
          TARGET_BUCKET: "elasticbeanstalk-ap-south-1-703671910601"
          TARGET_PREFIX: "resources/"
        run: |
          set -eu

          # Helper function: sanitize error output to prevent credential, token, or query string leakage.
          # NEVER outputs raw AWS CLI stderr under any circumstances.
          sanitize_err() {
            local RAW="${1:-}"
            local MATCH=""

            # 1. Match standard AWS CLI error format:
            MATCH=$(echo "$RAW" | grep -oE 'An error occurred \([A-Za-z0-9_.-]+\) when calling the [A-Za-z0-9_.-]+ operation' | head -n 1 || true)
            if [ -n "$MATCH" ]; then
              echo "$MATCH."
              return
            fi

            # 2. Check for standard AccessDenied pattern:
            if echo "$RAW" | grep -qi "AccessDenied"; then
              echo "AWS AccessDenied error."
              return
            fi

            # 3. Safe generic fallback: never print raw output
            echo "Operation failed (error details redacted for safety)."
          }

          # Explicit target restriction
          if [ "$TARGET_BUCKET" != "elasticbeanstalk-ap-south-1-703671910601" ]; then
            echo "::error::Diagnostic target bucket is strictly fixed to elasticbeanstalk-ap-south-1-703671910601. Failing closed."
            exit 1
          fi

          if [ "$TARGET_BUCKET" = "natyalms-media-2026" ]; then
            echo "::error::Production S3 bucket targeting is strictly prohibited."
            exit 1
          fi

          echo "================================================================"
          echo "CLOUDTRAIL CONFIGURATION INSPECTION (READ-ONLY)"
          echo "PURPOSE: Inspect existing CloudTrail trails and S3 logging status."
          echo "NOTE: This workflow does not modify settings or capture data events"
          echo "unless data-event logging is already active on an existing trail."
          echo "================================================================"
          echo "Staging Region:  $REGION (fixed)"
          echo "Target S3 Bucket: $TARGET_BUCKET (fixed)"
          echo "Target S3 Prefix: $TARGET_PREFIX (fixed)"
          echo ""

          # 1. Discover Trails with Pagination and Completeness Tracking
          echo "--- 1. Discovering CloudTrail Trails ---"
          TRAILS_JSON="[]"
          DISCOVERY_STATUS="UNKNOWN"
          DESC_OUT=""
          DESC_EXIT=0
          DESC_OUT=$(aws cloudtrail describe-trails --region "$REGION" --output json 2>&1) || DESC_EXIT=$?

          if [ $DESC_EXIT -eq 0 ]; then
            if ! echo "$DESC_OUT" | jq empty 2>/dev/null; then
              DISCOVERY_STATUS="FAILED"
              echo "ERROR: describe-trails returned unparseable output. Trail inventory is UNKNOWN / INCOMPLETE."
            else
              TRAIL_COUNT=$(echo "$DESC_OUT" | jq '.trailList | length' 2>/dev/null || echo "0")
              DISCOVERY_STATUS="COMPLETE"
              echo "SUCCESS: Retrieved trail inventory from describe-trails in $REGION ($TRAIL_COUNT trail(s) found)."
              TRAILS_JSON=$(echo "$DESC_OUT" | jq '[.trailList[] | {Name: .Name, TrailARN: .TrailARN, HomeRegion: .HomeRegion, IsMultiRegionTrail: .IsMultiRegionTrail, S3BucketName: .S3BucketName, CloudWatchLogsLogGroupArn: .CloudWatchLogsLogGroupArn}]')
            fi
          else
            CLEAN_ERR=$(sanitize_err "$DESC_OUT")
            echo "describe-trails failed in $REGION (exit status: $DESC_EXIT): $CLEAN_ERR"
            echo "Attempting fallback via paginated 'cloudtrail:ListTrails'..."

            ALL_LIST_TRAILS="[]"
            NEXT_TOKEN=""
            PAGE_COUNT=0
            MAX_PAGES=10
            PAGINATION_FAILED=false

            while true; do
              PAGE_COUNT=$((PAGE_COUNT + 1))
              PAGE_OUT=""
              PAGE_EXIT=0
              if [ -n "$NEXT_TOKEN" ]; then
                PAGE_OUT=$(aws cloudtrail list-trails --region "$REGION" --next-token "$NEXT_TOKEN" --output json 2>&1) || PAGE_EXIT=$?
              else
                PAGE_OUT=$(aws cloudtrail list-trails --region "$REGION" --output json 2>&1) || PAGE_EXIT=$?
              fi

              if [ $PAGE_EXIT -ne 0 ]; then
                CLEAN_PAGE_ERR=$(sanitize_err "$PAGE_OUT")
                PAGINATION_FAILED=true
                echo "Notice: list-trails page $PAGE_COUNT failed (exit status: $PAGE_EXIT): $CLEAN_PAGE_ERR"
                break
              fi

              if ! echo "$PAGE_OUT" | jq empty 2>/dev/null; then
                PAGINATION_FAILED=true
                echo "Notice: list-trails page $PAGE_COUNT returned unparseable output."
                break
              fi

              PAGE_ITEMS=$(echo "$PAGE_OUT" | jq '[.Trails[]? | {Name: .Name, TrailARN: .TrailARN, HomeRegion: (.HomeRegion // empty)}]')
              ALL_LIST_TRAILS=$(echo "$ALL_LIST_TRAILS" "$PAGE_ITEMS" | jq -s '.[0] + .[1]')

              NEXT_TOKEN=$(echo "$PAGE_OUT" | jq -r '.NextToken // .nextToken // empty' 2>/dev/null || true)
              if [ -z "$NEXT_TOKEN" ] || [ "$NEXT_TOKEN" = "null" ]; then
                break
              fi

              if [ $PAGE_COUNT -ge $MAX_PAGES ]; then
                echo "Notice: Pagination reached safety limit ($MAX_PAGES pages). Further pages not retrieved."
                PAGINATION_FAILED=true
                break
              fi
            done

            TOTAL_DISCOVERED=$(echo "$ALL_LIST_TRAILS" | jq '. | length' 2>/dev/null || echo "0")
            if [ "$PAGINATION_FAILED" = true ]; then
              if [ "$TOTAL_DISCOVERED" -gt 0 ]; then
                DISCOVERY_STATUS="PARTIAL"
                echo "WARNING: Trail discovery is INCOMPLETE/PARTIAL ($TOTAL_DISCOVERED trail(s) retrieved across $PAGE_COUNT page(s); pagination could not complete)."
                TRAILS_JSON="$ALL_LIST_TRAILS"
              else
                DISCOVERY_STATUS="FAILED"
                echo "ERROR: Trail discovery FAILED. INVENTORY STATUS: UNKNOWN / INCOMPLETE. No trails could be queried."
              fi
            else
              DISCOVERY_STATUS="PARTIAL"
              echo "WARNING: Trail discovery used list-trails fallback. Inventory retrieved ($TOTAL_DISCOVERED trail(s) across $PAGE_COUNT page(s)), but full describe-trails metadata was unavailable (PARTIAL)."
              TRAILS_JSON="$ALL_LIST_TRAILS"
            fi
          fi

          TRAIL_TOTAL=$(echo "$TRAILS_JSON" | jq '. | length' 2>/dev/null || echo "0")

          if [ "$DISCOVERY_STATUS" = "FAILED" ]; then
            echo ""
            echo "Cannot inspect trail-specific event selectors because trail inventory discovery failed."
            echo "INVENTORY STATUS: FAILED / UNKNOWN. The account's trail inventory could not be retrieved."
            if echo "$DESC_OUT $PAGE_OUT" | grep -qi "AccessDenied"; then
              echo "  Authorization Notice: CloudTrail trail discovery was denied for principal '${CALLER_ARN:-unknown}'."
              echo "  Missing Read-Only Permissions: 'cloudtrail:DescribeTrails' and 'cloudtrail:ListTrails' in region $REGION."
              echo "  The staging IAM role lacks read permissions on AWS CloudTrail. Event selectors cannot be evaluated offline."
            fi
            echo "Continuing with remaining safe read-only diagnostics..."
          elif [ "$TRAIL_TOTAL" -eq 0 ]; then
            echo ""
            if [ "$DISCOVERY_STATUS" = "COMPLETE" ]; then
              echo "No CloudTrail trails configured in region $REGION."
            else
              echo "No trails retrieved during incomplete discovery. INVENTORY STATUS: UNKNOWN / INCOMPLETE."
              echo "Do not treat this as confirmation that zero trails exist."
            fi
          else
            echo ""
            if [ "$DISCOVERY_STATUS" = "COMPLETE" ]; then
              echo "Trail Inventory Status: COMPLETE ($TRAIL_TOTAL trail(s) discovered)"
            else
              echo "Trail Inventory Status: INCOMPLETE / PARTIAL ($TRAIL_TOTAL trail(s) discovered; list may not be exhaustive)"
            fi
            echo ""
            echo "--- 2. Inspecting Each Trail in its Respective Home Region ---"

            for i in $(seq 0 $((TRAIL_TOTAL - 1))); do
              TRAIL_ITEM=$(echo "$TRAILS_JSON" | jq -c ".[$i]")
              TRAIL_NAME=$(echo "$TRAIL_ITEM" | jq -r '.Name')
              TRAIL_ARN=$(echo "$TRAIL_ITEM" | jq -r '.TrailARN // "unknown"')
              HOME_REGION=$(echo "$TRAIL_ITEM" | jq -r '.HomeRegion // empty')
              QUERY_REGION="${HOME_REGION:-$REGION}"

              echo "================================================================"
              echo "TRAIL: $TRAIL_NAME"
              echo "  ARN:         $TRAIL_ARN"
              echo "  Home Region: ${HOME_REGION:-unknown (querying in $QUERY_REGION)}"
              echo "----------------------------------------------------------------"

              # Query trail status in Home Region
              STATUS_OUT=""
              STATUS_EXIT=0
              STATUS_OUT=$(aws cloudtrail get-trail-status --name "$TRAIL_NAME" --region "$QUERY_REGION" --output json 2>&1) || STATUS_EXIT=$?
              IS_LOGGING="UNKNOWN"
              LATEST_DELIVERY="UNKNOWN"

              if [ $STATUS_EXIT -eq 0 ]; then
                RAW_IS_LOGGING=$(echo "$STATUS_OUT" | jq -r '.IsLogging // empty')
                if [ "$RAW_IS_LOGGING" = "true" ] || [ "$RAW_IS_LOGGING" = "false" ]; then
                  IS_LOGGING="$RAW_IS_LOGGING"
                else
                  IS_LOGGING="UNKNOWN"
                fi
                LATEST_DELIVERY=$(echo "$STATUS_OUT" | jq -r '.LatestDeliveryTime // "Never"')
              else
                CLEAN_STATUS_ERR=$(sanitize_err "$STATUS_OUT")
                echo "  Notice: get-trail-status failed in $QUERY_REGION (exit status: $STATUS_EXIT): $CLEAN_STATUS_ERR"
              fi

              # Query event selectors in Home Region
              SEL_OUT=""
              SEL_EXIT=0
              SEL_OUT=$(aws cloudtrail get-event-selectors --trail-name "$TRAIL_NAME" --region "$QUERY_REGION" --output json 2>&1) || SEL_EXIT=$?
              SEL_FETCH_SUCCESS=false

              if [ $SEL_EXIT -eq 0 ]; then
                SEL_FETCH_SUCCESS=true
              else
                CLEAN_SEL_ERR=$(sanitize_err "$SEL_OUT")
                echo "  Notice: get-event-selectors failed in $QUERY_REGION (exit status: $SEL_EXIT): $CLEAN_SEL_ERR"
              fi

              # Run thorough Python selector evaluator
              export TRAIL_NAME QUERY_REGION IS_LOGGING LATEST_DELIVERY SEL_OUT SEL_FETCH_SUCCESS TARGET_BUCKET TARGET_PREFIX
              python3 -c "import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_EOF'
              import os, sys, json

              trail_name = os.environ.get('TRAIL_NAME', 'unknown')
              query_region = os.environ.get('QUERY_REGION', 'unknown')
              is_logging = os.environ.get('IS_LOGGING', 'UNKNOWN')
              latest_delivery = os.environ.get('LATEST_DELIVERY', 'UNKNOWN')
              sel_out = os.environ.get('SEL_OUT', '')
              sel_fetch_ok = os.environ.get('SEL_FETCH_SUCCESS', 'false').lower() == 'true'
              target_bucket = os.environ.get('TARGET_BUCKET', 'elasticbeanstalk-ap-south-1-703671910601')
              target_prefix = os.environ.get('TARGET_PREFIX', 'resources/')

              print("1. TRAIL LOGGING STATUS:")
              if is_logging == "true":
                  print(f"   Status: ACTIVE (IsLogging: true)")
                  print(f"   Latest Delivery Time: {latest_delivery}")
              elif is_logging == "false":
                  print(f"   Status: INACTIVE (IsLogging: false)")
                  print(f"   Latest Delivery Time: {latest_delivery}")
              else:
                  print(f"   Status: UNKNOWN (could not verify IsLogging)")
              print("")

              print(f"2. S3 READ COVERAGE FOR s3://{target_bucket}/{target_prefix}*:")

              if not sel_fetch_ok:
                  print("   Coverage Status: UNKNOWN")
                  print("   Details: Could not retrieve event selectors from AWS API.")
                  print("")
                  print("3. DIAGNOSTIC ASSESSMENT:")
                  print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                  print("   Reason: Event selectors could not be retrieved. Cannot determine if S3 data events are covered.")
                  sys.exit(0)

              try:
                  data = json.loads(sel_out)
              except Exception:
                  print("   Coverage Status: UNKNOWN")
                  print("   Details: Selector JSON could not be parsed.")
                  print("")
                  print("3. DIAGNOSTIC ASSESSMENT:")
                  print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                  print("   Reason: Selector JSON could not be parsed.")
                  sys.exit(0)

              if not isinstance(data, dict):
                  print("   Coverage Status: UNKNOWN")
                  print("   Details: Selector data is not a JSON object.")
                  print("")
                  print("3. DIAGNOSTIC ASSESSMENT:")
                  print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                  print("   Reason: Selector data structure is malformed.")
                  sys.exit(0)

              try:
                  target_arn_prefix = f"arn:aws:s3:::{target_bucket}/{target_prefix}"
                  bucket_arn = f"arn:aws:s3:::{target_bucket}"
                  bucket_arn_slash = f"arn:aws:s3:::{target_bucket}/"
                  relevant_read_events = ('GetObject', 'HeadObject')

                  basic_selectors = data.get('EventSelectors', [])
                  adv_selectors = data.get('AdvancedEventSelectors', [])

                  if not isinstance(basic_selectors, list) or not isinstance(adv_selectors, list):
                      print("   Coverage Status: UNKNOWN")
                      print("   Details: Selector list structure is malformed.")
                      print("")
                      print("3. DIAGNOSTIC ASSESSMENT:")
                      print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                      print("   Reason: Selector list structure is malformed.")
                      sys.exit(0)

                  basic_matches = 0
                  basic_unknown = 0
                  basic_details = []

                  # Verified against AWS CloudTrail EventSelector schema:
                  # Supported keys: ReadWriteType, IncludeManagementEvents, DataResources,
                  #                 ExcludeDuplicateEventTypes, ExcludeManagementEventSources
                  supported_basic_keys = {
                      'ReadWriteType',
                      'IncludeManagementEvents',
                      'DataResources',
                      'ExcludeDuplicateEventTypes',
                      'ExcludeManagementEventSources'
                  }

                  for idx, es in enumerate(basic_selectors):
                      if not isinstance(es, dict):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Malformed selector entry (not a JSON object) (UNKNOWN)")
                          continue

                      # Validate keys in basic selector against schema
                      unsupported_keys = set(es.keys()) - supported_basic_keys
                      if unsupported_keys:
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Unsupported key(s) {sorted(list(unsupported_keys))} in selector structure (UNKNOWN)")
                          continue

                      rw = es.get('ReadWriteType', 'All')
                      if not isinstance(rw, str) or rw not in ('All', 'ReadOnly', 'WriteOnly'):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Unrecognized or non-string ReadWriteType '{rw}' (UNKNOWN)")
                          continue

                      inc_mgmt = es.get('IncludeManagementEvents')
                      if inc_mgmt is not None and not isinstance(inc_mgmt, bool):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Malformed IncludeManagementEvents (must be boolean) (UNKNOWN)")
                          continue

                      ex_dup = es.get('ExcludeDuplicateEventTypes')
                      if ex_dup is not None and (not isinstance(ex_dup, list) or not all(isinstance(x, str) for x in ex_dup)):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Malformed ExcludeDuplicateEventTypes (must be list of strings) (UNKNOWN)")
                          continue

                      ex_mgmt_src = es.get('ExcludeManagementEventSources')
                      if ex_mgmt_src is not None and (not isinstance(ex_mgmt_src, list) or not all(isinstance(x, str) for x in ex_mgmt_src)):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Malformed ExcludeManagementEventSources (must be list of strings) (UNKNOWN)")
                          continue

                      if rw == 'WriteOnly':
                          basic_details.append(f"Basic #{idx+1}: WriteOnly (does not cover read events)")
                          continue

                      data_resources = es.get('DataResources', [])
                      if not isinstance(data_resources, list):
                          basic_unknown += 1
                          basic_details.append(f"Basic #{idx+1}: Malformed DataResources (not a list) (UNKNOWN)")
                          continue

                      for dr_idx, dr in enumerate(data_resources):
                          if not isinstance(dr, dict):
                              basic_unknown += 1
                              basic_details.append(f"Basic #{idx+1}: Malformed DataResource #{dr_idx+1} (not a JSON object) (UNKNOWN)")
                              continue

                          dr_keys = set(dr.keys()) - {'Type', 'Values'}
                          if dr_keys:
                              basic_unknown += 1
                              basic_details.append(f"Basic #{idx+1}: Unsupported key(s) {sorted(list(dr_keys))} in DataResource #{dr_idx+1} (UNKNOWN)")
                              continue

                          dr_type = dr.get('Type')
                          if not isinstance(dr_type, str):
                              basic_unknown += 1
                              basic_details.append(f"Basic #{idx+1}: Malformed Type in DataResource #{dr_idx+1} (UNKNOWN)")
                              continue

                          values = dr.get('Values', [])
                          if not isinstance(values, list) or not all(isinstance(v, str) for v in values):
                              basic_unknown += 1
                              basic_details.append(f"Basic #{idx+1}: Malformed Values in DataResource #{dr_idx+1} (must be list of strings) (UNKNOWN)")
                              continue

                          if dr_type == 'AWS::S3::Object':
                              for val in values:
                                  if val in ('arn:aws:s3:::*', 'arn:aws:s3:::', 'arn:aws:s3'):
                                      basic_matches += 1
                                      basic_details.append(f"Basic #{idx+1}: Matched via all-S3 wildcard '{val}' ({rw})")
                                  elif val in (bucket_arn, bucket_arn_slash, f"{bucket_arn_slash}*"):
                                      basic_matches += 1
                                      basic_details.append(f"Basic #{idx+1}: Matched via whole-bucket ARN '{val}' ({rw})")
                                  elif val in (f"{bucket_arn}/{target_prefix}", f"{bucket_arn}/{target_prefix.rstrip('/')}", f"{bucket_arn}/{target_prefix}*"):
                                      basic_matches += 1
                                      basic_details.append(f"Basic #{idx+1}: Matched via exact prefix ARN '{val}' ({rw})")
                                  elif val.endswith('/') and target_arn_prefix.startswith(val):
                                      basic_matches += 1
                                      basic_details.append(f"Basic #{idx+1}: Matched via broader prefix '{val}' ({rw})")
                                  elif val.startswith(target_arn_prefix) and val != target_arn_prefix:
                                      basic_unknown += 1
                                      basic_details.append(f"Basic #{idx+1}: Only covers narrower subprefix '{val}' (UNKNOWN)")

                  adv_matches = 0
                  adv_unknown = 0
                  adv_details = []

                  supported_fields = {'eventCategory', 'resources.type', 'readOnly', 'resources.ARN', 'eventName'}
                  supported_operators = {'Equals', 'NotEquals', 'StartsWith', 'NotStartsWith', 'EndsWith', 'NotEndsWith'}
                  field_allowed_operators = {
                      'eventCategory': {'Equals'},
                      'resources.type': {'Equals'},
                      'readOnly': {'Equals'},
                      'resources.ARN': supported_operators,
                      'eventName': supported_operators,
                  }

                  for idx, aes in enumerate(adv_selectors):
                      if not isinstance(aes, dict):
                          adv_unknown += 1
                          adv_details.append(f"Advanced #{idx+1}: Malformed selector entry (not a JSON object) (UNKNOWN)")
                          continue

                      name = aes.get('Name', f"Advanced #{idx+1}")
                      if not isinstance(name, str):
                          name = f"Advanced #{idx+1}"

                      fs_list = aes.get('FieldSelectors', [])
                      if not isinstance(fs_list, list) or not fs_list:
                          adv_unknown += 1
                          adv_details.append(f"{name}: Missing or non-list FieldSelectors (UNKNOWN)")
                          continue

                      selector_definitive_no_match = False
                      no_match_reasons = []
                      selector_ambiguous = False
                      ambiguous_reasons = []
                      field_results = {}

                      for fs_idx, fs in enumerate(fs_list):
                          if not isinstance(fs, dict):
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Malformed field selector #{fs_idx+1}")
                              continue

                          field = fs.get('Field')
                          if not isinstance(field, str):
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Missing or non-string Field in selector #{fs_idx+1}")
                              continue

                          fs_keys = set(fs.keys()) - {'Field'}
                          if not fs_keys:
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Field selector for '{field}' has no operator")
                              continue

                          unsupported_ops = fs_keys - supported_operators
                          if unsupported_ops:
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Unsupported operator(s) {sorted(list(unsupported_ops))} in field '{field}'")
                              continue

                          if field not in supported_fields:
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Contains custom/context field '{field}' which cannot be evaluated faithfully offline")
                              continue

                          # Validate allowed operators by field against AWS documentation
                          unsupported_field_ops = fs_keys - field_allowed_operators[field]
                          if unsupported_field_ops:
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Field '{field}' only supports {sorted(list(field_allowed_operators[field]))}, but found unsupported operator(s): {sorted(list(unsupported_field_ops))}")
                              continue

                          # Validate operators value types
                          valid_operators = True
                          op_map = {}
                          for op_name in supported_operators:
                              op_val = fs.get(op_name, [])
                              if op_val is None:
                                  op_val = []
                              if not isinstance(op_val, list) or not all(isinstance(x, str) for x in op_val):
                                  valid_operators = False
                                  break
                              op_map[op_name] = op_val

                          if not valid_operators:
                              selector_ambiguous = True
                              ambiguous_reasons.append(f"Malformed operator list in field '{field}'")
                              continue

                          equals = op_map['Equals']
                          not_equals = op_map['NotEquals']
                          starts_with = op_map['StartsWith']
                          not_starts_with = op_map['NotStartsWith']
                          ends_with = op_map['EndsWith']
                          not_ends_with = op_map['NotEndsWith']

                          if field == 'eventCategory':
                              # Only Equals is supported by AWS CloudTrail for eventCategory
                              if not equals:
                                  selector_ambiguous = True
                                  ambiguous_reasons.append("eventCategory Equals list is empty")
                              elif 'Data' not in equals:
                                  selector_definitive_no_match = True
                                  no_match_reasons.append("eventCategory does not include 'Data'")
                                  field_results['eventCategory'] = False
                              else:
                                  field_results['eventCategory'] = True

                          elif field == 'resources.type':
                              # Only Equals is supported by AWS CloudTrail for resources.type
                              target_type = 'AWS::S3::Object'
                              if not equals:
                                  selector_ambiguous = True
                                  ambiguous_reasons.append("resources.type Equals list is empty")
                              elif target_type not in equals:
                                  selector_definitive_no_match = True
                                  no_match_reasons.append("resources.type does not equal 'AWS::S3::Object'")
                                  field_results['resources.type'] = False
                              else:
                                  field_results['resources.type'] = True

                          elif field == 'readOnly':
                              # Only Equals is supported by AWS CloudTrail for readOnly
                              if not equals:
                                  selector_ambiguous = True
                                  ambiguous_reasons.append("readOnly Equals list is empty")
                              elif 'true' not in equals:
                                  selector_definitive_no_match = True
                                  no_match_reasons.append("readOnly does not include 'true'")
                                  field_results['readOnly'] = False
                              else:
                                  field_results['readOnly'] = True

                          elif field == 'eventName':
                              allowed_events = set()
                              for ev in relevant_read_events:
                                  # Positive operators
                                  if equals and ev not in equals:
                                      continue
                                  if starts_with and not any(ev.startswith(x) for x in starts_with):
                                      continue
                                  if ends_with and not any(ev.endswith(x) for x in ends_with):
                                      continue

                                  # Negative operators
                                  if not_equals and ev in not_equals:
                                      continue
                                  if not_starts_with and any(ev.startswith(x) for x in not_starts_with):
                                      continue
                                  if not_ends_with and any(ev.endswith(x) for x in not_ends_with):
                                      continue

                                  allowed_events.add(ev)

                              if len(allowed_events) == 0:
                                  selector_definitive_no_match = True
                                  no_match_reasons.append("eventName excludes relevant S3 read events (GetObject, HeadObject)")
                              elif len(allowed_events) < len(relevant_read_events):
                                  selector_ambiguous = True
                                  excluded = sorted(list(set(relevant_read_events) - allowed_events))
                                  ambiguous_reasons.append(f"eventName condition excludes relevant S3 read event(s): {excluded}")

                              field_results['eventName'] = not selector_definitive_no_match

                          elif field == 'resources.ARN':
                              if ends_with or not_ends_with:
                                  selector_ambiguous = True
                                  ambiguous_reasons.append("resources.ARN uses EndsWith/NotEndsWith suffix filtering which cannot be evaluated faithfully offline")

                              # 1. Prefix exclusion (NotStartsWith) evaluated strictly according to prefix semantics
                              for nsw in not_starts_with:
                                  if nsw in ('arn:aws:s3:::*', 'arn:aws:s3:::', 'arn:aws:s3') or nsw in (bucket_arn, bucket_arn_slash) or nsw == target_arn_prefix or target_arn_prefix.startswith(nsw):
                                      selector_definitive_no_match = True
                                      no_match_reasons.append(f"resources.ARN NotStartsWith explicitly excludes target prefix '{nsw}'")
                                  elif nsw.startswith(target_arn_prefix):
                                      selector_ambiguous = True
                                      ambiguous_reasons.append(f"resources.ARN NotStartsWith excludes subpath under target prefix: '{nsw}'")

                              # 2. Exact ARN exclusion (NotEquals) evaluated strictly as exact ARN exclusion
                              for ne in not_equals:
                                  if ne in ('arn:aws:s3:::*', 'arn:aws:s3:::', 'arn:aws:s3'):
                                      selector_ambiguous = True
                                      ambiguous_reasons.append(f"resources.ARN NotEquals contains ambiguous wildcard/root '{ne}'")
                                  elif ne == target_arn_prefix or ne.startswith(target_arn_prefix):
                                      selector_ambiguous = True
                                      ambiguous_reasons.append(f"resources.ARN NotEquals excludes specific target object/path: '{ne}'")
                                  # Note: Exact exclusion of a bucket ARN (e.g. bucket_arn or bucket_arn_slash) or unrelated ARN
                                  # does not by itself exclude object ARNs under resources/ (e.g. arn:aws:s3:::bucket/resources/app.zip)

                              # 3. Positive operators (StartsWith and Equals)
                              has_positive = bool(starts_with or equals)
                              if has_positive:
                                  matches_arn = False
                                  # StartsWith prefix matching
                                  for sw in starts_with:
                                      if sw in ('arn:aws:s3:::*', 'arn:aws:s3:::', 'arn:aws:s3'):
                                          matches_arn = True
                                      elif sw in (bucket_arn, bucket_arn_slash, f"{bucket_arn_slash}*"):
                                          matches_arn = True
                                      elif sw in (f"{bucket_arn}/{target_prefix}", f"{bucket_arn}/{target_prefix.rstrip('/')}", f"{bucket_arn}/{target_prefix}*"):
                                          matches_arn = True
                                      elif sw.endswith('/') and target_arn_prefix.startswith(sw):
                                          matches_arn = True
                                      elif sw.startswith(target_arn_prefix) and sw != target_arn_prefix:
                                          selector_ambiguous = True
                                          ambiguous_reasons.append(f"resources.ARN StartsWith only covers narrower subprefix '{sw}'")

                                  # Equals exact matching
                                  for eq in equals:
                                      if eq == target_arn_prefix or eq.startswith(target_arn_prefix):
                                          selector_ambiguous = True
                                          ambiguous_reasons.append(f"resources.ARN Equals only matches specific object/ARN '{eq}', not full prefix")
                                      # Note: Equals with bucket ARN or unrelated ARN does not match object ARNs under resources/

                                  if not matches_arn and not selector_ambiguous:
                                      selector_definitive_no_match = True
                                      no_match_reasons.append("resources.ARN does not encompass target prefix")

                                  field_results['resources.ARN'] = matches_arn
                              else:
                                  # Negative-only resources.ARN selector:
                                  # In CloudTrail semantics, when resources.type is AWS::S3::Object and no positive
                                  # ARN filter is specified, all S3 objects are candidate matches except those matching
                                  # negative operators.
                                  if not selector_definitive_no_match and not selector_ambiguous:
                                      field_results['resources.ARN'] = True
                                  else:
                                      field_results['resources.ARN'] = False

                      if selector_ambiguous:
                          adv_unknown += 1
                          adv_details.append(f"{name}: UNKNOWN ({'; '.join(ambiguous_reasons)})")
                          continue

                      if selector_definitive_no_match:
                          adv_details.append(f"{name}: Definitive NO_MATCH ({'; '.join(no_match_reasons)})")
                          continue

                      if not field_results.get('resources.type', False):
                          adv_details.append(f"{name}: NO_MATCH (resources.type does not specify AWS::S3::Object)")
                          continue

                      # Check resources.ARN coverage (if ARN field was present, must be True; if omitted, defaults to True for AWS::S3::Object)
                      if not field_results.get('resources.ARN', True):
                          adv_details.append(f"{name}: NO_MATCH (resources.ARN does not encompass target prefix)")
                          continue

                      adv_matches += 1
                      adv_details.append(f"{name}: MATCH (appears to cover S3 read events for '{target_prefix}')")

                  total_matches = basic_matches + adv_matches
                  total_unknown = basic_unknown + adv_unknown

                  if total_unknown > 0:
                      cov_status = "UNKNOWN"
                  elif total_matches > 0:
                      cov_status = "MATCH"
                  else:
                      cov_status = "NO_MATCH"

                  print(f"   Coverage Status: {cov_status}")
                  print(f"   Basic Selectors matching:    {basic_matches}")
                  print(f"   Advanced Selectors matching: {adv_matches}")
                  print(f"   Ambiguous/Unknown selectors: {total_unknown}")
                  for d in (basic_details + adv_details):
                      print(f"     * {d}")
                  if not (basic_details + adv_details):
                      print("     * No S3 data-event selectors configured on this trail.")
                  print("")

                  print("3. DIAGNOSTIC ASSESSMENT:")
                  if cov_status == "MATCH":
                      if is_logging == "true":
                          print("   ASSESSMENT: SELECTOR CONFIGURATION APPEARS TO COVER S3 READS & TRAIL REPORTS ACTIVE")
                          print(f"   The retrieved selector configuration appears to include S3 read data events for 's3://{target_bucket}/{target_prefix}'.")
                          print(f"   The trail reports 'IsLogging: true' in {query_region}.")
                          print("   Note: This indicates only that the retrieved configuration appears to cover S3 read requests under this prefix.")
                          print("   It makes no claim that any specific denied request is guaranteed to be captured or delivered,")
                          print("   which depends on trail health, delivery bucket permissions, and service-level event delivery.")
                      elif is_logging == "false":
                          print("   ASSESSMENT: SELECTOR CONFIGURATION APPEARS TO COVER S3 READS BUT TRAIL REPORTS INACTIVE")
                          print(f"   The retrieved selector configuration appears to include S3 read data events for 's3://{target_bucket}/{target_prefix}',")
                          print(f"   but the trail reports 'IsLogging: false' in {query_region}.")
                          print("   Note: Events are not recorded while trail logging is reported as inactive.")
                      else:
                          print("   ASSESSMENT: SELECTOR CONFIGURATION APPEARS TO COVER S3 READS WITH UNKNOWN LOGGING STATUS")
                          print(f"   The retrieved selector configuration appears to include S3 read data events for 's3://{target_bucket}/{target_prefix}',")
                          print(f"   but trail logging status could not be verified.")
                          print("   Note: Uncertainty in trail logging status prevents determining whether events are actively recorded.")
                  elif cov_status == "UNKNOWN":
                      print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                      print(f"   The retrieved selector configuration contains exclusions, operator combinations, custom fields, or unretrievable details")
                      print(f"   that prevent deterministic offline evaluation. Trail logging status is reported as '{is_logging}'.")
                      print("   Note: Available data is insufficient to determine whether S3 read requests under this prefix would be recorded.")
                  else:
                      if is_logging == "true":
                          print("   ASSESSMENT: RETRIEVED SELECTORS DO NOT APPEAR TO COVER S3 READS (TRAIL REPORTS ACTIVE)")
                          print(f"   The retrieved selector configuration for this trail does not appear to cover S3 read data events for 's3://{target_bucket}/{target_prefix}'.")
                          print(f"   The trail reports 'IsLogging: true' in {query_region}.")
                          print("   Note: This reflects only what is retrieved from this trail's configuration; it does not claim that denied requests are or are not captured elsewhere.")
                      elif is_logging == "false":
                          print("   ASSESSMENT: RETRIEVED SELECTORS DO NOT APPEAR TO COVER S3 READS (TRAIL INACTIVE)")
                          print(f"   The retrieved selector configuration does not appear to cover S3 read data events for 's3://{target_bucket}/{target_prefix}'.")
                          print(f"   Trail logging status is reported as inactive in {query_region}.")
                      else:
                          print("   ASSESSMENT: RETRIEVED SELECTORS DO NOT APPEAR TO COVER S3 READS (TRAIL STATUS UNKNOWN)")
                          print(f"   The retrieved selector configuration does not appear to cover S3 read data events for 's3://{target_bucket}/{target_prefix}'.")
                          print("   Trail logging status could not be verified.")

              except Exception:
                  print("   Coverage Status: UNKNOWN")
                  print("   Details: An internal parsing error occurred while evaluating event selectors.")
                  print("")
                  print("3. DIAGNOSTIC ASSESSMENT:")
                  print("   ASSESSMENT: COVERAGE UNCERTAIN (UNKNOWN)")
                  print("   Reason: Event selector evaluation could not complete due to an unexpected format.")

          PY_EOF
              echo "================================================================"
              echo ""
            done
          fi

          echo ""
          echo "--- 3. Checking S3 Server Access Logging on $TARGET_BUCKET ---"
          S3_LOG_OUT=""
          S3_LOG_EXIT=0
          S3_LOG_OUT=$(aws s3api get-bucket-logging --bucket "$TARGET_BUCKET" --region "$REGION" --output json 2>&1) || S3_LOG_EXIT=$?

          if [ $S3_LOG_EXIT -eq 0 ]; then
            LOGGING_ENABLED=$(echo "$S3_LOG_OUT" | jq '.LoggingEnabled // empty')
            if [ -n "$LOGGING_ENABLED" ]; then
