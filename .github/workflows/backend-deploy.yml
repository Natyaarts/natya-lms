name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Configure S3 Bucket CORS for Direct Uploads
        run: |
          cat << 'EOF' > /tmp/s3_cors.json
          {
            "CORSRules": [
              {
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["GET", "PUT", "POST", "HEAD"],
                "AllowedOrigins": [
                  "https://academy.natyaarts.com",
                  "https://natya-lms.vercel.app",
                  "http://localhost:3000"
                ],
                "ExposeHeaders": ["ETag"],
                "MaxAgeSeconds": 3000
              }
            ]
          }
          EOF
          aws s3api put-bucket-cors \
            --bucket natyalms-media-2026 \
            --cors-configuration file:///tmp/s3_cors.json \
            --region ap-south-1 || true

      - name: Generate Deployment Package
        run: |
          cd backend
          zip -r ../deploy.zip . \
            -x ".env" \
            -x "*/.env" \
            -x "venv/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "static/*"

      - name: Wait for EB Ready and Deploy via AWS CLI
        run: |
          mkdir -p diag
          echo "=== CHECKING ENVIRONMENT STATUS ==="
          
          # Wait up to 5 minutes if environment is currently updating
          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-environments --environment-names Natya-lms-backend-env --region ap-south-1 --query 'Environments[0].Status' --output text 2>/dev/null || echo "")
            echo "[$i/30] Status: $STATUS"
            if [ "$STATUS" = "Ready" ]; then
              echo "Environment is Ready for deployment!"
              break
            fi
            sleep 10
          done

          # Upload artifact to Elastic Beanstalk S3 bucket
          BUCKET=$(aws elasticbeanstalk create-storage-location --region ap-south-1 --query 'S3Bucket' --output text)
          S3_KEY="backend-${{ github.sha }}.zip"
          echo "Uploading deploy.zip to s3://${BUCKET}/${S3_KEY}..."
          aws s3 cp deploy.zip "s3://${BUCKET}/${S3_KEY}" --region ap-south-1

          # Create application version
          echo "Creating application version backend-${{ github.sha }}..."
          aws elasticbeanstalk create-application-version \
            --application-name natya-lms-backend \
            --version-label "backend-${{ github.sha }}" \
            --source-bundle S3Bucket="${BUCKET}",S3Key="${S3_KEY}" \
            --region ap-south-1 || true

          # Deploy to environment
          echo "Deploying version backend-${{ github.sha }} to Natya-lms-backend-env..."
          aws elasticbeanstalk update-environment \
            --environment-name Natya-lms-backend-env \
            --version-label "backend-${{ github.sha }}" \
            --region ap-south-1

          echo "Deployment command sent successfully to AWS Elastic Beanstalk!"
