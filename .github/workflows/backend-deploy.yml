name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Inspect Current EB Status & Reboot Frozen Instance
        run: |
          mkdir -p diag
          echo "=== DESCRIBE ENVIRONMENTS ===" > diag/eb_report.txt
          aws elasticbeanstalk describe-environments --region ap-south-1 >> diag/eb_report.txt 2>&1 || true
          
          echo "=== DESCRIBE EVENTS ===" >> diag/eb_report.txt
          aws elasticbeanstalk describe-events --environment-name Natya-lms-backend-env --max-items 25 --region ap-south-1 >> diag/eb_report.txt 2>&1 || true
          
          echo "=== DESCRIBE RESOURCES & REBOOT ===" >> diag/eb_report.txt
          INSTANCE_ID=$(aws elasticbeanstalk describe-environment-resources --environment-name Natya-lms-backend-env --region ap-south-1 --query 'EnvironmentResources.Instances[0].Id' --output text || echo "")
          echo "Detected Instance ID: $INSTANCE_ID" >> diag/eb_report.txt
          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            echo "Issuing EC2 reboot to instance $INSTANCE_ID..." >> diag/eb_report.txt
            aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" --region ap-south-1 >> diag/eb_report.txt 2>&1 || true
            echo "Waiting 35 seconds for instance to reboot and initialize..." >> diag/eb_report.txt
            sleep 35
          fi
          
          cat diag/eb_report.txt >> $GITHUB_STEP_SUMMARY

      - name: Generate Deployment Package
        run: |
          cd backend
          zip -r ../deploy.zip . \
            -x ".env" \
            -x "*/.env" \
            -x "venv/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "static/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ vars.EB_APP_NAME || 'natya-lms-backend' }}
          environment_name: ${{ vars.EB_ENV_NAME || 'Natya-lms-backend-env' }}
          version_label: backend-${{ github.sha }}
          region: ap-south-1
          deployment_package: deploy.zip
          wait_for_deployment: false

      - name: Post-deploy EB Event Check & Report Commit
        if: always()
        run: |
          sleep 20
          echo "=== POST-DEPLOY EVENTS ===" >> diag/eb_report.txt
          aws elasticbeanstalk describe-events --environment-name Natya-lms-backend-env --max-items 20 --region ap-south-1 >> diag/eb_report.txt 2>&1 || true
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag/eb_report.txt
          git commit -m "chore: record EB diagnostic report [skip ci]" || true
          git push || true
