name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Deployment Package
        run: |
          cd backend
          zip -r ../deploy.zip . -x "*.sqlite3" -x ".env" -x "venv/*" -x "*/__pycache__/*" -x "*.pyc"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ vars.EB_APP_NAME || 'natya-lms-backend' }}
          environment_name: ${{ vars.EB_ENV_NAME || 'natya-lms-backend-env' }}
          version_label: "backend-${{ github.sha }}"
          region: ap-south-1
          deployment_package: deploy.zip
