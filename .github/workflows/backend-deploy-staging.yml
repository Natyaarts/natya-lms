name: Deploy Backend to Staging (Isolated Environment)

on:
  push:
    branches:
      - 'staging/video-protection'
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: 'Type DEPLOY-STAGING to confirm staging deployment'
        required: true
        default: 'DEPLOY-STAGING'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging Elastic Beanstalk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      # STEP 1: PRE-FLIGHT SAFETY GUARDS

      - name: Safety Guard - Verify Manual Dispatch Confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
        run: |
          if [ "$CONFIRM_STAGING" != "DEPLOY-STAGING" ]; then
            echo "::error::Manual staging deployment rejected."
            exit 1
          fi

      - name: Safety Guard - Refuse Production Branches
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" = "main" ] || [ "$REF" = "master" ] || [ "$REF" = "production" ]; then
            echo "::error::Staging workflow cannot run against production branches."
            exit 1
          fi

      - name: Safety Guard - Validate Staging Secrets
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          S3_BUCKET: ${{ secrets.STAGING_AWS_STORAGE_BUCKET_NAME }}
          ROLE_ARN: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
        run: |
          set -eu

          [ -n "$ROLE_ARN" ] || { echo "::error::Missing STAGING_AWS_ROLE_ARN"; exit 1; }
          [ -n "$EXPECTED_ACCOUNT" ] || { echo "::error::Missing STAGING_AWS_ACCOUNT_ID"; exit 1; }
          [ -n "$EB_ENV" ] || { echo "::error::Missing STAGING_EB_ENV_NAME"; exit 1; }
          [ -n "$S3_BUCKET" ] || { echo "::error::Missing STAGING_AWS_STORAGE_BUCKET_NAME"; exit 1; }

          if [ "$EB_ENV" = "Natya-lms-backend-env" ]; then
            echo "::error::Production Elastic Beanstalk environment is prohibited."
            exit 1
          fi

          case "$EB_ENV" in
            *staging*|*stage*|*STAGING*|*STAGE*) ;;
            *) echo "::error::Environment name is not identifiable as staging."; exit 1 ;;
          esac

          if [ "$S3_BUCKET" = "natyalms-media-2026" ]; then
            echo "::error::Production S3 bucket is prohibited."
            exit 1
          fi

          case "$S3_BUCKET" in
            *staging*|*stage*|*STAGING*|*STAGE*) ;;
            *) echo "::error::Bucket name is not identifiable as staging."; exit 1 ;;
          esac

          echo "Staging isolation checks passed."

      # STEP 2: TEMPORARY OIDC DIAGNOSTICS
      # Prints selected claims only, never the complete token.

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC issuer: ${payload.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(payload.aud)}`);
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`GitHub ref: ${payload.ref}`);
            core.info(`GitHub environment: ${payload.environment || 'not present'}`);

            const expectedIssuer = 'https://token.actions.githubusercontent.com';
            const expectedSubject = 'repo:Natyaarts@214949047/natya-lms@1310863272:environment:staging';

            const audienceMatches = Array.isArray(payload.aud)
              ? payload.aud.includes('sts.amazonaws.com')
              : payload.aud === 'sts.amazonaws.com';

            core.info(`Issuer matches: ${payload.iss === expectedIssuer}`);
            core.info(`Audience matches: ${audienceMatches}`);
            core.info(`Subject matches: ${payload.sub === expectedSubject}`);

      # STEP 3: AUTHENTICATE TO AWS VIA OIDC

      - name: Authenticate to AWS via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          role-session-name: GitHubActions-NatyaLMS-StagingDeploy
          aws-region: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}

      # STEP 4: VERIFY AWS IDENTITY AND REGION

      - name: Verify Caller AWS Account ID and Region
        env:
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
          EXPECTED_REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          CALLER_IDENTITY=$(aws sts get-caller-identity --output json)
          ACTUAL_ACCOUNT=$(echo "$CALLER_IDENTITY" | jq -r '.Account')
          ACTUAL_ARN=$(echo "$CALLER_IDENTITY" | jq -r '.Arn')

          echo "Authenticated ARN: $ACTUAL_ARN"

          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Authenticated AWS account does not match expected staging account."
            exit 1
          fi

          ACTUAL_REGION=$(aws configure get region || true)
          if [ -z "$ACTUAL_REGION" ]; then
            ACTUAL_REGION="$EXPECTED_REGION"
          fi

          if [ "$ACTUAL_REGION" != "$EXPECTED_REGION" ]; then
            echo "::error::AWS region does not match expected staging region."
            exit 1
          fi

          echo "AWS account and region verified."

      # STEP 5: VERIFY STAGING ENVIRONMENT

      - name: Verify Staging Elastic Beanstalk Environment Exists
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          ENV_STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --region "$REGION" \
            --query 'Environments[0].Status' \
            --output text)

          if [ "$ENV_STATUS" = "None" ] || [ -z "$ENV_STATUS" ]; then
            echo "::error::Staging environment was not found."
            exit 1
          fi

          echo "Staging environment status: $ENV_STATUS"

      # STEP 6: CHECKOUT AND PACKAGE BACKEND

      - name: Checkout Staging Source Code
        uses: actions/checkout@v4

      - name: Package Staging Backend
        run: |
          cd backend
          zip -r ../deploy-staging.zip . \
            -x ".env" \
            -x "*/.env" \
            -x "venv/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "static/*" \
            -x "*.sqlite3"

      # STEP 7: CONFIGURE STAGING S3 CORS

      - name: Configure Staging S3 Bucket CORS
        env:
          S3_BUCKET: ${{ secrets.STAGING_AWS_STORAGE_BUCKET_NAME }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
          FRONTEND_ORIGIN: ${{ secrets.STAGING_FRONTEND_URL || 'https://staging.natyaarts.com' }}
        run: |
          cat << EOF > /tmp/s3_staging_cors.json
          {
            "CORSRules": [
              {
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["GET", "PUT", "POST", "HEAD"],
                "AllowedOrigins": [
                  "$FRONTEND_ORIGIN",
                  "https://staging.natyaarts.com",
                  "https://staging-academy.natyaarts.com",
                  "https://natya-lms-staging.vercel.app",
                  "http://localhost:3000"
                ],
                "ExposeHeaders": ["ETag"],
                "MaxAgeSeconds": 3000
              }
            ]
          }
          EOF

          aws s3api put-bucket-cors \
            --bucket "$S3_BUCKET" \
            --cors-configuration file:///tmp/s3_staging_cors.json \
            --region "$REGION" \
            || echo "Warning: Unable to configure staging bucket CORS."

      # STEP 8: DEPLOY TO STAGING ELASTIC BEANSTALK

      - name: Deploy to Staging Elastic Beanstalk
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          EB_APP: ${{ secrets.STAGING_EB_APP_NAME || 'natya-lms-backend' }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          echo "Waiting for staging environment to become Ready..."

          READY=false
          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --region "$REGION" \
              --query 'Environments[0].Status' \
              --output text)

            echo "[$i/30] Status: $STATUS"

            if [ "$STATUS" = "Ready" ]; then
              READY=true
              break
            fi

            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Staging environment did not become Ready in time."
            exit 1
          fi

          VERSION_LABEL="backend-staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "$REGION" \
            --query 'S3Bucket' \
            --output text)
          S3_KEY="${VERSION_LABEL}.zip"

          echo "Uploading staging package..."
          aws s3 cp deploy-staging.zip "s3://${BUCKET}/${S3_KEY}" --region "$REGION"

          echo "Creating staging application version..."
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${S3_KEY}" \
            --region "$REGION"

          echo "Updating staging environment..."
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION_LABEL" \
            --region "$REGION"

          echo "Staging deployment initiated."

