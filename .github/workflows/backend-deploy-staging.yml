name: Deploy Backend to Staging (Isolated Environment)

on:
  push:
    branches:
      - 'staging/video-protection'
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: 'Type DEPLOY-STAGING to confirm staging deployment'
        required: true
        default: 'DEPLOY-STAGING'

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to Staging Elastic Beanstalk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      # STEP 1: PRE-FLIGHT SAFETY GUARDS

      - name: Safety Guard - Verify Manual Dispatch Confirmation
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_STAGING: ${{ inputs.confirm_staging }}
        run: |
          if [ "$CONFIRM_STAGING" != "DEPLOY-STAGING" ]; then
            echo "::error::Manual staging deployment rejected."
            exit 1
          fi

      - name: Safety Guard - Refuse Production Branches
        env:
          REF: ${{ github.ref_name }}
        run: |
          if [ "$REF" = "main" ] || [ "$REF" = "master" ] || [ "$REF" = "production" ]; then
            echo "::error::Staging workflow cannot run against production branches."
            exit 1
          fi

      - name: Safety Guard - Validate Staging Secrets
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          S3_BUCKET: ${{ secrets.STAGING_AWS_STORAGE_BUCKET_NAME }}
          ROLE_ARN: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
        run: |
          set -eu

          [ -n "$ROLE_ARN" ] || { echo "::error::Missing STAGING_AWS_ROLE_ARN"; exit 1; }
          [ -n "$EXPECTED_ACCOUNT" ] || { echo "::error::Missing STAGING_AWS_ACCOUNT_ID"; exit 1; }
          [ -n "$EB_ENV" ] || { echo "::error::Missing STAGING_EB_ENV_NAME"; exit 1; }
          [ -n "$S3_BUCKET" ] || { echo "::error::Missing STAGING_AWS_STORAGE_BUCKET_NAME"; exit 1; }

          if [ "$EB_ENV" = "Natya-lms-backend-env" ]; then
            echo "::error::Production Elastic Beanstalk environment is prohibited."
            exit 1
          fi

          case "$EB_ENV" in
            *staging*|*stage*|*STAGING*|*STAGE*) ;;
            *) echo "::error::Environment name is not identifiable as staging."; exit 1 ;;
          esac

          if [ "$S3_BUCKET" = "natyalms-media-2026" ]; then
            echo "::error::Production S3 bucket is prohibited."
            exit 1
          fi

          case "$S3_BUCKET" in
            *staging*|*stage*|*STAGING*|*STAGE*) ;;
            *) echo "::error::Bucket name is not identifiable as staging."; exit 1 ;;
          esac

          echo "Staging isolation checks passed."

      # STEP 2: TEMPORARY OIDC DIAGNOSTICS
      # Prints selected claims only, never the complete token.

      - name: Diagnose GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC issuer: ${payload.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(payload.aud)}`);
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`GitHub ref: ${payload.ref}`);
            core.info(`GitHub environment: ${payload.environment || 'not present'}`);

            const expectedIssuer = 'https://token.actions.githubusercontent.com';
            const expectedSubject = 'repo:Natyaarts@214949047/natya-lms@1310863272:environment:staging';

            const audienceMatches = Array.isArray(payload.aud)
              ? payload.aud.includes('sts.amazonaws.com')
              : payload.aud === 'sts.amazonaws.com';

            core.info(`Issuer matches: ${payload.iss === expectedIssuer}`);
            core.info(`Audience matches: ${audienceMatches}`);
            core.info(`Subject matches: ${payload.sub === expectedSubject}`);

      # STEP 3: AUTHENTICATE TO AWS VIA OIDC

      - name: Authenticate to AWS via OIDC Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_ARN }}
          role-session-name: GitHubActions-NatyaLMS-StagingDeploy
          aws-region: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}

      # STEP 4: VERIFY AWS IDENTITY AND REGION

      - name: Verify Caller AWS Account ID and Region
        env:
          EXPECTED_ACCOUNT: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
          EXPECTED_REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          CALLER_IDENTITY=$(aws sts get-caller-identity --output json)
          ACTUAL_ACCOUNT=$(echo "$CALLER_IDENTITY" | jq -r '.Account')
          ACTUAL_ARN=$(echo "$CALLER_IDENTITY" | jq -r '.Arn')

          echo "Authenticated ARN: $ACTUAL_ARN"

          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Authenticated AWS account does not match expected staging account."
            exit 1
          fi

          ACTUAL_REGION=$(aws configure get region || true)
          if [ -z "$ACTUAL_REGION" ]; then
            ACTUAL_REGION="$EXPECTED_REGION"
          fi

          if [ "$ACTUAL_REGION" != "$EXPECTED_REGION" ]; then
            echo "::error::AWS region does not match expected staging region."
            exit 1
          fi

          echo "AWS account and region verified."

      # STEP 5: VERIFY STAGING ENVIRONMENT

      - name: Verify Staging Elastic Beanstalk Environment Exists
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          ENV_STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --region "$REGION" \
            --query 'Environments[0].Status' \
            --output text)

          if [ "$ENV_STATUS" = "None" ] || [ -z "$ENV_STATUS" ]; then
            echo "::error::Staging environment was not found."
            exit 1
          fi

          echo "Staging environment status: $ENV_STATUS"

      # STEP 6: CHECKOUT AND PACKAGE BACKEND

      - name: Checkout Staging Source Code
        uses: actions/checkout@v4

      - name: Package Staging Backend
        run: |
          cd backend
          zip -r ../deploy-staging.zip . \
            -x ".env" \
            -x "*/.env" \
            -x "venv/*" \
            -x "*/__pycache__/*" \
            -x "*.pyc" \
            -x "static/*" \
            -x "*.sqlite3" \
            -x "*.zip" \
            -x "*.mp4"

      # STEP 7: CONFIGURE STAGING S3 CORS

      - name: Configure Staging S3 Bucket CORS
        env:
          S3_BUCKET: ${{ secrets.STAGING_AWS_STORAGE_BUCKET_NAME }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
          FRONTEND_ORIGIN: ${{ secrets.STAGING_FRONTEND_URL || 'https://staging.natyaarts.com' }}
        run: |
          cat << EOF > /tmp/s3_staging_cors.json
          {
            "CORSRules": [
              {
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["GET", "PUT", "POST", "HEAD"],
                "AllowedOrigins": [
                  "$FRONTEND_ORIGIN",
                  "https://staging.natyaarts.com",
                  "https://staging-academy.natyaarts.com",
                  "https://natya-lms-staging.vercel.app",
                  "http://localhost:3000"
                ],
                "ExposeHeaders": ["ETag"],
                "MaxAgeSeconds": 3000
              }
            ]
          }
          EOF

          aws s3api put-bucket-cors \
            --bucket "$S3_BUCKET" \
            --cors-configuration file:///tmp/s3_staging_cors.json \
            --region "$REGION" \
            || echo "Warning: Unable to configure staging bucket CORS."

      # STEP 8: DEPLOY TO STAGING ELASTIC BEANSTALK

      - name: Deploy to Staging Elastic Beanstalk
        env:
          EB_ENV: ${{ secrets.STAGING_EB_ENV_NAME }}
          EB_APP: ${{ secrets.STAGING_EB_APP_NAME || 'natya-lms-backend' }}
          REGION: ${{ secrets.STAGING_AWS_REGION || 'ap-south-1' }}
        run: |
          set -eu

          echo "Waiting for staging environment to become Ready..."

          READY=false
          for i in $(seq 1 30); do
            STATUS=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --region "$REGION" \
              --query 'Environments[0].Status' \
              --output text)

            echo "[$i/30] Status: $STATUS"

            if [ "$STATUS" = "Ready" ]; then
              READY=true
              break
            fi

            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Staging environment did not become Ready in time."
            exit 1
          fi

          ENV_ID=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --region "$REGION" \
            --query 'Environments[0].EnvironmentId' \
            --output text)
          STACK_NAME="awseb-${ENV_ID}-stack"
          echo "Staging Environment ID: $ENV_ID"
          echo "CloudFormation Stack Name: $STACK_NAME"

          VERSION_LABEL="backend-staging-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BUCKET=$(aws elasticbeanstalk create-storage-location \
            --region "$REGION" \
            --query 'S3Bucket' \
            --output text)
          S3_KEY="${VERSION_LABEL}.zip"

          echo "Uploading staging package to s3://${BUCKET}/${S3_KEY}..."
          aws s3 cp deploy-staging.zip "s3://${BUCKET}/${S3_KEY}" --region "$REGION"

          echo "Creating staging application version $VERSION_LABEL..."
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APP" \
            --version-label "$VERSION_LABEL" \
            --source-bundle "S3Bucket=${BUCKET},S3Key=${S3_KEY}" \
            --region "$REGION"

          DEPLOY_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Updating staging environment to $VERSION_LABEL at $DEPLOY_START_TIME..."
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENV" \
            --version-label "$VERSION_LABEL" \
            --region "$REGION"

          echo "Waiting 20s for Elastic Beanstalk update to engage..."
          sleep 20

          echo "Monitoring Elastic Beanstalk environment update..."
          DEPLOY_COMPLETE=false
          for i in $(seq 1 45); do
            ENV_INFO=$(aws elasticbeanstalk describe-environments \
              --environment-names "$EB_ENV" \
              --region "$REGION" \
              --query 'Environments[0].[Status,Health,HealthStatus,VersionLabel]' \
              --output json)

            CURR_STATUS=$(echo "$ENV_INFO" | jq -r '.[0]')
            CURR_HEALTH=$(echo "$ENV_INFO" | jq -r '.[1]')
            CURR_HEALTH_STATUS=$(echo "$ENV_INFO" | jq -r '.[2]')
            CURR_VERSION=$(echo "$ENV_INFO" | jq -r '.[3]')

            echo "[$i/45] Status: $CURR_STATUS | Health: $CURR_HEALTH ($CURR_HEALTH_STATUS) | Running Version: $CURR_VERSION"

            if [ "$CURR_STATUS" = "Ready" ]; then
              DEPLOY_COMPLETE=true
              break
            fi

            sleep 20
          done

          echo ""
          echo ""
          echo "================================================================"
          echo "LATEST ELASTIC BEANSTALK EVENTS & VERSION DIAGNOSTICS"
          echo "================================================================"
          echo "--- Environment Events (Since Deployment Start: $DEPLOY_START_TIME) ---"
          if EB_START_EVENTS=$(aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENV" \
            --start-time "$DEPLOY_START_TIME" \
            --region "$REGION" \
            --max-records 30 \
            --output json 2>eb_start_err.log); then
            EVENT_COUNT=$(echo "$EB_START_EVENTS" | jq '.Events | length' 2>/dev/null || echo "0")
            if [ "$EVENT_COUNT" -gt 0 ]; then
              echo "$EB_START_EVENTS" | jq -r '.Events[]? | "\(.EventDate) [\(.Severity)] \(.Message)"'
            else
              echo "No events recorded since deployment start ($DEPLOY_START_TIME)."
            fi
          else
            echo "Failed to query environment events since start:"
            cat eb_start_err.log
          fi

          echo "--- Recent Environment Events (All, Last 20) ---"
          if EB_RECENT_EVENTS=$(aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENV" \
            --region "$REGION" \
            --max-records 20 \
            --output json 2>eb_recent_err.log); then
            echo "$EB_RECENT_EVENTS" | jq -r '.Events[]? | "\(.EventDate) [\(.Severity)] \(.Message)"'
          else
            echo "Failed to query recent environment events:"
            cat eb_recent_err.log
          fi

          echo "--- Application Version Status ($VERSION_LABEL) ---"
          if EB_VER_OUT=$(aws elasticbeanstalk describe-application-versions \
            --application-name "$EB_APP" \
            --version-labels "$VERSION_LABEL" \
            --region "$REGION" \
            --output json 2>eb_ver_err.log); then
            echo "$EB_VER_OUT" | jq -r '.ApplicationVersions[]? | "Version: \(.VersionLabel) | Status: \(.Status) | Created: \(.DateCreated) | S3: \(.SourceBundle.S3Bucket)/\(.SourceBundle.S3Key)"'
          else
            echo "Failed to query application version status:"
            cat eb_ver_err.log
          fi

          echo ""
          echo "================================================================"
          echo "CLOUDFORMATION STACK DIAGNOSTICS"
          echo "================================================================"
          echo "Stack Status:"
          if CF_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'Stacks[0].[StackName,StackStatus,StackStatusReason]' \
            --output table 2>cf_status_err.log); then
            echo "$CF_STATUS"
          else
            echo "Could not query describe-stacks for $STACK_NAME:"
            cat cf_status_err.log
          fi

          echo "Recent CloudFormation Stack Events (Last 20):"
          if CF_EVENTS=$(aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'StackEvents[:20].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]' \
            --output table 2>cf_events_err.log); then
            echo "$CF_EVENTS"
          else
            echo "Could not query describe-stack-events for $STACK_NAME:"
            cat cf_events_err.log
          fi

          echo "CloudFormation Stack Resources:"
          if CF_RES=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query 'StackResources[:20].[LogicalResourceId,ResourceType,ResourceStatus]' \
            --output table 2>cf_res_err.log); then
            echo "$CF_RES"
          else
            echo "Could not query describe-stack-resources for $STACK_NAME:"
            cat cf_res_err.log
          fi

          echo ""
          echo ""
          echo "================================================================"
          echo "CLOUDTRAIL ERROR METADATA DIAGNOSTICS"
          echo "================================================================"
          LOOKUP_START=$(date -u -d '20 minutes ago' +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v-20M +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "$DEPLOY_START_TIME")

          echo "1. CloudTrail UpdateStack Events (Since $LOOKUP_START):"
          CT_UPDATE_OUT=$(aws cloudtrail lookup-events \
            --lookup-attributes AttributeKey=EventName,AttributeValue=UpdateStack \
            --start-time "$LOOKUP_START" \
            --region "$REGION" \
            --max-results 10 \
            --output json 2>&1)
          CT_UPDATE_EXIT=$?

          if [ $CT_UPDATE_EXIT -eq 0 ]; then
            CT_COUNT=$(echo "$CT_UPDATE_OUT" | jq '.Events | length' 2>/dev/null || echo "0")
            if [ "$CT_COUNT" -gt 0 ]; then
              echo "$CT_UPDATE_OUT" | jq -r '
                .Events[] |
                (.CloudTrailEvent | try fromjson catch {}) as $detail |
                "Time: \(.EventTime // "unknown")\n" +
                "  Event:        \(.EventName // "UpdateStack")\n" +
                "  User/Role:    \($detail.userIdentity.arn // .Username // "unknown")\n" +
                "  InvokedBy:    \($detail.invokedBy // "direct")\n" +
                "  ErrorCode:    \($detail.errorCode // "SUCCESS")\n" +
                "  ErrorMessage: \($detail.errorMessage // "None")\n" +
                "  RequestID:    \($detail.requestID // "None")\n" +
                "  RequestParams:\($detail.requestParameters | tojson // "null")\n" +
                "  StackName:    \($detail.requestParameters.stackName // $detail.requestParameters.StackName // "None")\n" +
                "  TemplateURL:  \($detail.requestParameters.templateURL // $detail.requestParameters.TemplateURL // "None")\n" +
                "  RoleARN:      \($detail.requestParameters.roleARN // $detail.requestParameters.RoleARN // "None")\n" +
                "----------------------------------------------------------------"
              '
            else
              echo "No UpdateStack events recorded in CloudTrail since $LOOKUP_START."
            fi
          else
            echo "CloudTrail UpdateStack lookup failed (exit status: $CT_UPDATE_EXIT):"
            echo "$CT_UPDATE_OUT"
          fi

          echo "2. CloudTrail AccessDenied / Error Events (Since $LOOKUP_START):"
          CT_ERR_OUT=$(aws cloudtrail lookup-events \
            --start-time "$LOOKUP_START" \
            --region "$REGION" \
            --max-results 25 \
            --output json 2>&1)
          CT_ERR_EXIT=$?

          if [ $CT_ERR_EXIT -eq 0 ]; then
            ERROR_COUNT=$(echo "$CT_ERR_OUT" | jq '[.Events[] | (.CloudTrailEvent | try fromjson catch {}) | select(.errorCode != null)] | length' 2>/dev/null || echo "0")
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "$CT_ERR_OUT" | jq -r '
                .Events[] |
                (.CloudTrailEvent | try fromjson catch {}) as $detail |
                select($detail.errorCode != null) |
                "Time: \(.EventTime // "unknown")\n" +
                "  Event:        \(.EventName // "unknown")\n" +
                "  Source:       \($detail.eventSource // "unknown")\n" +
                "  User/Role:    \($detail.userIdentity.arn // .Username // "unknown")\n" +
                "  InvokedBy:    \($detail.invokedBy // "direct")\n" +
                "  ErrorCode:    \($detail.errorCode)\n" +
                "  ErrorMessage: \($detail.errorMessage // "None")\n" +
                "  RequestID:    \($detail.requestID // "None")\n" +
                "----------------------------------------------------------------"
              '
            else
              echo "No AccessDenied or error events found in CloudTrail since $LOOKUP_START."
            fi
          else
            echo "CloudTrail general error lookup failed (exit status: $CT_ERR_EXIT):"
            echo "$CT_ERR_OUT"
          fi

          echo ""
          echo "================================================================"
          echo "ELASTIC BEANSTALK ENVIRONMENT CONFIGURATION SETTINGS"
          echo "================================================================"
          EB_CFG_OUT=$(aws elasticbeanstalk describe-configuration-settings \
            --application-name "$EB_APP" \
            --environment-name "$EB_ENV" \
            --region "$REGION" \
            --query 'ConfigurationSettings[0].OptionSettings[?Namespace==`aws:elasticbeanstalk:environment` || Namespace==`aws:autoscaling:launchconfiguration` || Namespace==`aws:elasticbeanstalk:container:python`].[Namespace,OptionName,Value]' \
            --output table 2>&1)
          EB_CFG_EXIT=$?

          if [ $EB_CFG_EXIT -eq 0 ]; then
            echo "$EB_CFG_OUT"
          else
            echo "elasticbeanstalk:DescribeConfigurationSettings query failed (exit status: $EB_CFG_EXIT):"
            echo "$EB_CFG_OUT"
          fi

          echo ""
          echo "================================================================"
          echo "ELASTIC BEANSTALK S3 STORAGE BUCKET DIAGNOSTICS"
          echo "================================================================"
          echo "Storage Bucket: $BUCKET"
          echo "1. Bucket Location:"
          aws s3api get-bucket-location --bucket "$BUCKET" 2>&1 || true

          echo "2. Bucket Policy:"
          BPOL_OUT=$(aws s3api get-bucket-policy --bucket "$BUCKET" --output json 2>&1)
          BPOL_EXIT=$?
          if [ $BPOL_EXIT -eq 0 ]; then
            echo "$BPOL_OUT"
          else
            echo "Could not retrieve bucket policy (exit status: $BPOL_EXIT):"
            echo "$BPOL_OUT"
          fi

          echo "3. Bucket Encryption:"
          BENC_OUT=$(aws s3api get-bucket-encryption --bucket "$BUCKET" 2>&1)
          BENC_EXIT=$?
          if [ $BENC_EXIT -eq 0 ]; then
            echo "$BENC_OUT"
          else
            echo "Could not retrieve bucket encryption (exit status: $BENC_EXIT):"
            echo "$BENC_OUT"
          fi

          echo "4. S3 Template & Storage Hierarchy Inspection:"
          inspect_s3_prefix() {
            local prefix="$1"
            local label="$2"
            local max_items="${3:-20}"
            echo "--- $label: s3://${BUCKET}/${prefix} ---"

            local api_out=""
            local api_exit=0
            api_out=$(aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --prefix "$prefix" \
              --max-items "$max_items" \
              --region "$REGION" \
              --output json 2>&1) || api_exit=$?

            if [ $api_exit -eq 0 ]; then
              local key_count
              key_count=$(echo "$api_out" | jq -r '.KeyCount // (.Contents | length) // 0' 2>/dev/null || echo "0")
              if [ "$key_count" -gt 0 ]; then
                echo "SUCCESS: Found $key_count object(s) under '$prefix':"
                echo "$api_out" | jq -r '.Contents[]? | "  \(.LastModified) | \(.Size) bytes | \(.Key)"'
              else
                echo "SUCCESS (Accessible): Prefix exists and is accessible, but currently contains 0 objects (KeyCount: 0)."
              fi
            else
              if echo "$api_out" | grep -qi "AccessDenied"; then
                echo "AccessDenied: Caller is not authorized to list 's3://${BUCKET}/${prefix}' (exit status: $api_exit)"
              else
                echo "FAILED (exit status: $api_exit): Unable to list objects via s3api:"
              fi
              echo "$api_out"
            fi

            local ls_out=""
            local ls_exit=0
            ls_out=$(aws s3 ls "s3://${BUCKET}/${prefix}" --region "$REGION" 2>&1) || ls_exit=$?
            if [ $ls_exit -eq 0 ]; then
              if [ -n "$ls_out" ]; then
                echo "aws s3 ls output:"
                echo "$ls_out" | sed 's/^/  /'
              else
                echo "aws s3 ls: 0 items listed."
              fi
            else
              if echo "$ls_out" | grep -qi "AccessDenied"; then
                echo "aws s3 ls: AccessDenied (exit status: $ls_exit)"
              else
                echo "aws s3 ls: non-zero exit status $ls_exit (may indicate empty prefix or error)"
              fi
              [ -n "$ls_out" ] && echo "$ls_out" | sed 's/^/  /'
            fi
            echo ""
          }

          # A. Bucket Top-Level Hierarchy (Folders via delimiter '/')
          echo "--- Top-Level Bucket Hierarchy: s3://${BUCKET}/ ---"
          top_out=""
          top_exit=0
          top_out=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --delimiter "/" \
            --region "$REGION" \
            --output json 2>&1) || top_exit=$?

          if [ $top_exit -eq 0 ]; then
            echo "SUCCESS: Top-level prefixes (folders):"
            echo "$top_out" | jq -r '.CommonPrefixes[]?.Prefix // empty' | sed 's/^/  /' || true
            echo "Top-level root objects:"
            echo "$top_out" | jq -r '.Contents[]? | "  \(.LastModified) | \(.Size) bytes | \(.Key)"' || true
          else
            if echo "$top_out" | grep -qi "AccessDenied"; then
              echo "AccessDenied: Caller is not authorized to list top-level of s3://${BUCKET}/ (exit status: $top_exit)"
            else
              echo "FAILED (exit status: $top_exit): Unable to list top-level of s3://${BUCKET}/:"
            fi
            echo "$top_out"
          fi
          echo ""

          # B. Resources Root (with reasonable limit)
          inspect_s3_prefix "resources/" "Root resources prefix (up to 30 items)" 30

          # C. Resources Templates Root
          inspect_s3_prefix "resources/templates/" "Application & shared templates prefix" 20

          # D. Resources Environments Root
          inspect_s3_prefix "resources/environments/" "Environment assets & logs root prefix" 20

          # E. Specific Template & Environment Sub-Prefixes
          inspect_s3_prefix "resources/templates/${EB_APP}/" "Application-specific template prefix" 20
          inspect_s3_prefix "resources/environments/templates/" "Environment templates parent prefix" 20
          inspect_s3_prefix "resources/environments/templates/${ENV_ID}/" "Environment-specific template prefix (${ENV_ID})" 20

          echo ""
          echo "================================================================"
          echo "DEPLOYMENT VERIFICATION SUMMARY"
          echo "================================================================"
          FINAL_INFO=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENV" \
            --region "$REGION" \
            --query 'Environments[0].[Status,Health,HealthStatus,VersionLabel]' \
            --output json)
          FINAL_STATUS=$(echo "$FINAL_INFO" | jq -r '.[0]')
          FINAL_HEALTH=$(echo "$FINAL_INFO" | jq -r '.[1]')
          FINAL_HEALTH_STATUS=$(echo "$FINAL_INFO" | jq -r '.[2]')
          FINAL_VERSION=$(echo "$FINAL_INFO" | jq -r '.[3]')

          echo "Target Version:     $VERSION_LABEL"
          echo "Running Version:    $FINAL_VERSION"
          echo "Environment Status: $FINAL_STATUS"
          echo "Environment Health: $FINAL_HEALTH ($FINAL_HEALTH_STATUS)"

          if [ "$FINAL_STATUS" != "Ready" ]; then
            echo "::error::Deployment failed: Environment did not return to Ready state (Current status: $FINAL_STATUS)."
            exit 1
          fi

          if [ "$FINAL_VERSION" != "$VERSION_LABEL" ]; then
            echo "::error::Deployment failed: Running version ($FINAL_VERSION) does not match deployed version ($VERSION_LABEL)."
            exit 1
          fi

          echo "SUCCESS: Staging backend version $VERSION_LABEL is now actively running in $EB_ENV!"

