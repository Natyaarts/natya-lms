<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Offline | Natya</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: #000; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 360px; width: 100%; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { font-size: 14px; line-height: 1.5; color: #a1a1aa; margin: 0 0 24px; }
    a {
      display: inline-block; padding: 10px 20px; border-radius: 12px; background: #facc15;
      color: #000; font-size: 14px; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Natya">
    <h1>You're offline</h1>
    <p>Natya needs an internet connection to load your classes and lessons. Check your connection and try again.</p>
    <a href="/dashboard">Try again</a>
  </main>
</body>
</html>
